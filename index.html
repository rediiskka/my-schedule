/* ==== СИНХРОНИЗАЦИЯ ИНТЕРФЕЙСА ============================================== */
function syncUI(){
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===st.view));
}
/* Состояние в адресе. Список полей описан один раз: и запись, и чтение
   ходят по этой таблице, поэтому они не могут разъехаться. */
const URL_FIELDS=[
  {key:"v",  get:()=>st.view,                     set:v=>st.view=v,               always:true},
  {key:"w",  get:()=>st.cur,                      set:v=>st.cur=+v,               always:true},
  {key:"s",  get:()=>st.scope,                    set:v=>st.scope=v,              always:true},
  {key:"f",  get:()=>st.from,                     set:v=>st.from=v||""},
  {key:"t",  get:()=>st.to,                       set:v=>st.to=v||""},
  {key:"q",  get:()=>st.term,                     set:v=>st.term=v||""},
  {key:"d",  get:()=>st.fDay,                     set:v=>st.fDay=v||""},
  {key:"ty", get:()=>st.fType,                    set:v=>st.fType=v||""},
  {key:"te", get:()=>st.fTeachers.join("~"),      set:v=>st.fTeachers=(v||"").split("~").filter(Boolean)},
  {key:"m",  get:()=>st.view==="month"?st.monthPtr:"", set:v=>st.monthPtr=+v},
  {key:"p",  get:()=>st.pop?st.pop.join("."):"",  set:v=>{
      const a=(v||"").split(".").map(Number);
      st.pop=a.length===2&&a.every(n=>!isNaN(n))?a:null;}},
];
/* Навигационный след: вид, неделя, месяц и открытый день. Только их смена
   заводит новую запись в истории — иначе кнопка «назад» (и свайп на телефоне)
   отматывала бы по одной букве поиска, а до самой страницы дело не доходило. */
function navKey(){return [st.view,st.cur,st.monthPtr,st.pop?st.pop.join("."):""].join("|");}
let _nav=null;
function hashWrite(){
  const p=new URLSearchParams();
  URL_FIELDS.forEach(f=>{const v=f.get();if(f.always||(v!==""&&v!=null))p.set(f.key,v);});
  const key=navKey(),push=_nav!==null&&key!==_nav;
  _nav=key;
  try{history[push?"pushState":"replaceState"](null,"","#"+p.toString());}
  catch{location.hash=p.toString();}
}
function hashRead(){
  if(!location.hash||location.hash.length<2)return false;
  const p=new URLSearchParams(location.hash.slice(1));
  URL_FIELDS.forEach(f=>{if(p.has(f.key)||!f.always)f.set(p.get(f.key));});
  return true;
}
function flash(btn,msg){const o=btn.textContent;btn.textContent=msg;setTimeout(()=>btn.textContent=o,1600);}
function save(){localStorage.setItem(KEY,JSON.stringify(st));hashWrite();}
function load(){try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"));}catch{}}

/* ==== ПОДСКАЗКИ ПОИСКА ====================================================== */
function showSugg(val){const box=$("suggbox");val=(val||"").trim().toLowerCase();
  if(val.length<2){box.classList.add("hidden");return;}
  const seen=new Set(),m=[];
  for(const s of SUGG){if(m.length>=8)break;const low=s.v.toLowerCase();
    if(low.includes(val)&&!seen.has(low)){seen.add(low);m.push(s);}}
  if(!m.length){box.classList.add("hidden");return;}
  box.innerHTML=m.map(s=>`<div class="sugg-item" data-v="${esc(s.v)}"><span class="si" style="background:${s.c}"></span>${hl(s.v)}<span class="sc">${s.kind}</span></div>`).join("");
  box.classList.remove("hidden");}

/* ==== УПРАВЛЕНИЕ · фильтры, тема, меню ====================================== */
// подпись кнопки мультифильтра: «Все» / фамилия / «Выбрано N»
function syncTeacherBtn(){
  const n=st.fTeachers.length;
  $("f-teacher-btn").textContent=n===0?"Все":n===1?st.fTeachers[0]:"Выбрано "+n;
}
// Только список; галочки и подпись кнопки расставляет restoreInputs — одно место на всё.
function buildTeacherFilter(list){
  $("f-teacher-list").innerHTML=list.map(t=>
    `<label><input type="checkbox" value="${esc(t)}">${esc(t)}</label>`).join("");
}
function opts(sel,arr,ph){sel.innerHTML=`<option value="">${ph}</option>`+arr.map(v=>`<option value="${v}">${v}</option>`).join("");}
/* Справочники, собранные из данных: типы пар, преподаватели, предметы. */
function collectDictionaries(){
  const uniq=pick=>[...new Set(DATA.weeks.flatMap(w=>w.days.flatMap(
    d=>d.pairs.flatMap(p=>p.lessons.map(pick)))))].filter(Boolean);
  return{
    types:uniq(l=>l.tn).sort(),
    teachers:uniq(l=>l.teacher).sort(),
    subjects:uniq(l=>l.subject),
  };
}

/* Наполнение выпадающих списков и подсказок поиска. */
function fillDictionaries(d){
  opts($("f-day"),DAYS,"Все дни");
  opts($("f-type"),d.types,"Все типы");
  buildTeacherFilter(d.teachers);
  SUGG=[...d.subjects.map(v=>({v,kind:"предмет",c:"var(--lav)"})),
        ...d.teachers.map(v=>({v,kind:"препод",c:"var(--blue)"})),
        ...d.types.map(v=>({v,kind:"тип",c:typeColor(v)}))];
}

/* Легенда над расписанием. */
/* Легенда объясняет две разные вещи: цвет плашки — это тип пары,
   а цвет фона карточки — моя пара это или общая. Без второго ряда фон
   читается как украшение. Третий ряд — те же цвета, что и у категорий задач. */
function fillLegend(d){
  const type=d.types.map(t=>`<span class="lg"><i style="background:${typeColor(t)}"></i>${t}</span>`).join("")
    +`<span class="lg"><i class="ring"></i>сегодня</span>`
    +`<span class="lg"><i class="ring now"></i>сейчас / ближайшая</span>`;
  const fill=`<span class="lg-title">Фон карточки</span>`
    +`<span class="lg"><i class="fill" style="background:var(--sg2)"></i>моя подгруппа</span>`
    +`<span class="lg"><i class="fill" style="background:var(--sg0)"></i>пара у всех</span>`;
  const tasks=`<span class="lg-title">Мои задачи</span>`
    +Object.values(MY_TYPE).map(c=>`<span class="lg"><i style="background:${c.color}"></i>${c.label}</span>`).join("");
  $("legend").innerHTML=`<div class="lg-row">${type}</div><div class="lg-row">${fill}</div><div class="lg-row">${tasks}</div>`;
}

/* Переключение вида и периода. */
function bindViewButtons(){
  document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
    if(b.dataset.view==="month"&&st.view!=="month")st.monthPtr=monthOfWeek(st.cur);
    st.view=b.dataset.view;save();show();closeNav();});
  // scope
  $("from").onchange=e=>{st.from=e.target.value;st.scope="custom";st.view="list";save();show();};
  $("to").onchange=e=>{st.to=e.target.value;st.scope="custom";st.view="list";save();show();};
}

/* Селектор недели или месяца в шапке. */
function bindPicker(){
  // В списке селектор недели не переключает период, а отсекает его начало: показ
  // открывается с выбранной недели. Конец берётся максимумом — короткий период
  // (скажем, три дня) дотянется до конца недели, длинный останется как есть.
  // Иначе выбор недели схлопывал бы заданный месяц и стирал поля, а прокручивать
  // до нужной недели через весь месяц — мучение.
  const goWeek=i=>{
    st.cur=clamp(i,0,DATA.weeks.length-1);
    if(st.view==="list"){
      const[a,z]=weekDates(st.cur);
      const[,end]=currentRange();
      if(a)st.from=isoDate(a);
      const keep=st.to||isoDate(end);
      const weekEnd=z?isoDate(z):keep;
      st.to=keep>weekEnd?keep:weekEnd;
      st.scope="custom";
    }else st.scope="week";
    save();show();
  };
  const goMonth=i=>{st.monthPtr=clamp(i,0,MONTHS.length-1);save();show();};
  const step=d=>inMonth()?goMonth(st.monthPtr+d):goWeek(st.cur+d);
  $("week").onchange=e=>inMonth()?goMonth(+e.target.value):goWeek(+e.target.value);
  $("prev").onclick=()=>step(-1);
  $("next").onclick=()=>step(1);
}

/* Поиск и подсказки. */
function bindSearch(d){

  $("q").onfocus=e=>{if(e.target.value.trim().length>=2)showSugg(e.target.value);};
  $("q").onblur=()=>setTimeout(()=>$("suggbox").classList.add("hidden"),150);
  $("q").addEventListener("keydown",e=>{if(e.key==="Escape")$("suggbox").classList.add("hidden");});
  $("suggbox").onclick=e=>{const it=e.target.closest(".sugg-item");if(!it)return;
    st.term=it.dataset.v.toLowerCase();$("q").value=it.dataset.v;$("suggbox").classList.add("hidden");save();render();};
}

/* Фильтры: день, тип, подгруппа, преподаватели. */
function bindFilters(d){
  $("f-day").onchange=e=>{st.fDay=e.target.value;save();render();};
  $("f-type").onchange=e=>{st.fType=e.target.value;save();render();};

/* Тема: авто, светлая, тёмная. */
function bindTheme(){
  function resolveTheme(){return st.theme==="auto"?(mq.matches?"dracula":"cupcake"):st.theme;}
  function applyTheme(){document.documentElement.setAttribute("data-theme",resolveTheme());
    const ic=st.theme==="auto"?"auto":st.theme==="dracula"?"moon":"sun";
    const tt="Тема: "+(st.theme==="auto"?"как в системе":st.theme==="dracula"?"тёмная":"светлая");
    [$("theme"),$("theme2")].forEach(b=>{if(b){b.innerHTML=`<svg class="ic" aria-hidden="true"><use href="#i-${ic}"/></svg>`;b.title=tt;}});save();}
  const cycleTheme=()=>{st.theme=st.theme==="auto"?"cupcake":st.theme==="cupcake"?"dracula":"auto";applyTheme();};
  $("theme").onclick=cycleTheme;if($("theme2"))$("theme2").onclick=cycleTheme;
  if(mq.addEventListener)mq.addEventListener("change",()=>{if(st.theme==="auto")applyTheme();});
  applyTheme();

/* Рубильник «пары группы»: расписание вуза убирается, свои записи остаются. */

  const sync=()=>buttons.forEach(b=>b.classList.toggle("active",(b.dataset.uni==="1")===!!st.uni));
  buttons.forEach(b=>b.onclick=()=>{

/* Сторона меню и его открытие. */
function bindSideToggle(){
  function applySide(){document.body.classList.toggle("side-left",st.side==="left");
    layoutVars();
    $("sideseg").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.side===st.side));
    save();}
  // смена стороны: то же движение, что и по кнопке — уехала, переехала, выехала
  let _switching=0;
  $("sideseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    if(b.dataset.side===st.side||_switching)return;
    const next=b.dataset.side, body=document.body, sb=$("sidebar");
    _switching=1;
    body.classList.add("panel-hidden"); applyShift();        // уезжает под центр
    const show=()=>{body.classList.remove("panel-hidden");applyShift();_switching=0;};
    setTimeout(()=>{
      body.classList.add("no-anim");                          // перенос, пока не видно
      st.side=next; applySide();
      void sb.offsetWidth;
      body.classList.remove("no-anim");
      requestAnimationFrame(show);
      setTimeout(show,60);
    },260);});
  applySide();
}

/* ==== ПОГОДА ================================================================ */
function wcode(c){const m={0:["sun","ясно"],1:["cloudsun","в основном ясно"],2:["cloudsun","переменная облачность"],
  3:["cloud","пасмурно"],45:["fog","туман"],48:["fog","туман"],
  51:["rain","морось"],53:["rain","морось"],55:["rain","морось"],
  61:["rain","дождь"],63:["rain","дождь"],65:["rain","сильный дождь"],
  71:["snow","снег"],73:["snow","снег"],75:["snow","сильный снег"],
  80:["rain","ливень"],81:["rain","ливень"],82:["storm","ливень"],
  85:["snow","снег"],86:["snow","снег"],95:["storm","гроза"],96:["storm","гроза"],99:["storm","гроза"]};
  return m[c]?{icon:m[c][0],text:m[c][1]}:{icon:"thermo",text:""};}
const CODE_RAIN=[51,53,55,56,57,61,63,65,66,67,80,81,82];
const CODE_SNOW=[71,73,75,77,85,86];
const CODE_STORM=[95,96,99];
const CODE_FOG=[45,48];
/* Совет — чистая функция от параметров: ощущаемая температура, код погоды,
   ветер (км/ч), влажность (%), вероятность осадков (%), UV, день/ночь. */
function advice({feels,code,wind=0,humidity=null,precip=null,uv=null,isDay=1}){
  const out=[];
  // слой одежды — по ощущаемой температуре
  if(feels<=-20)out.push("экстремальный холод: пуховик, шапка, перчатки, шарф");
  else if(feels<=-10)out.push("сильный мороз: пуховик, шапка, перчатки");
  else if(feels<=-2)out.push("мороз: зимняя куртка и шапка");
  else if(feels<5)out.push("холодно: тёплая куртка");
  else if(feels<11)out.push("прохладно: пальто или куртка");
  else if(feels<17)out.push("свежо: ветровка или тёплая кофта");
  else if(feels<24)out.push("комфортно: лёгкая кофта");
  else if(feels<29)out.push("тепло: футболка");
  else out.push("жарко: light-одежда и вода с собой");
  // осадки
  if(CODE_STORM.includes(code))out.push("гроза: лучше переждать");
  else if(CODE_SNOW.includes(code))out.push("снег: непромокаемая обувь");
  else if(CODE_RAIN.includes(code))out.push("дождь: зонт");
  else if(precip!=null&&precip>=50)out.push("может пойти дождь: зонт на всякий");
  // ветер
  if(wind>=35)out.push("сильный ветер: зонт выворачивает, лучше капюшон");
  else if(wind>=20)out.push("ветрено");
  // влажность работает по-разному в холод и в жару
  if(humidity!=null){
    if(humidity>=85&&feels<8)out.push("сыро: мёрзнешь быстрее, чем по градуснику");
    else if(humidity>=70&&feels>=25)out.push("душно");
    else if(humidity<=25&&feels<=0)out.push("сухой мороз: щиплет лицо");
  }
  // солнце и видимость
  if(isDay&&uv!=null&&uv>=6)out.push("солнце активное: крем");
  if(CODE_FOG.includes(code))out.push("туман: видно плохо");
  const text=out.slice(0,3).join(" · ");
  return text?text.charAt(0).toUpperCase()+text.slice(1):"";}
function weather(){
  const box=$("weather");
  const go=async(lat,lon,place)=>{try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      +`&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day`
      +`&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=auto`;
    const j=await(await fetch(u)).json();const c=j.current;const info=wcode(c.weather_code);
    box.innerHTML=`<div class="w-emoji"><svg class="ic" aria-hidden="true"><use href="#i-${info.icon}"/></svg></div><div>
      <div class="w-temp">${Math.round(c.temperature_2m)}°</div>
      <div class="w-sub">${place} · ${info.text} · ${Math.round(j.daily.temperature_2m_min[0])}…${Math.round(j.daily.temperature_2m_max[0])}°</div>
      <div class="w-advice">${advice({
        feels:c.apparent_temperature??c.temperature_2m,
        code:c.weather_code,
        wind:c.wind_speed_10m,
        humidity:c.relative_humidity_2m,
        precip:j.daily.precipitation_probability_max?.[0],
        uv:j.daily.uv_index_max?.[0],
        isDay:c.is_day})}</div></div>`;
  }catch{box.innerHTML='<div class="w-sub">погода недоступна</div>';}};
  go(54.9846,73.3729,"Омск");
}

/* ==== РАСКЛАДКА · панель и лист ============================================= */
// Ширины берём из стилей: держать их в двух местах — верный способ забыть
// поменять в одном. Палитра и размеры живут только в :root.
const cssPx=(name,fallback)=>{
  const v=getComputedStyle(document.documentElement).getPropertyValue(name);
  const n=parseFloat(v);
  return isNaN(n)?fallback:n;
};
const MENU_W=cssPx("--panelw",266), CONTENT_MAX=cssPx("--maxw",1040);
/* Одна модель на все ширины:
     контент шириной min(1040, окно) стоит по центру окна;
     боковое поле = (окно - контент) / 2;
     поле >= меню  -> меню просто стоит в поле, ничего не двигается (body.wide);
     поле <  меню  -> край окна поджимает меню, меню поджимает контент ровно на нехватку.
   На скролл ничего не считаем — липкость меню делает браузер. */
function layoutVars(){
  const root=document.documentElement, W=root.clientWidth;
  const cw=Math.min(CONTENT_MAX,W);
  const gutter=(W-cw)/2;                       // свободное поле сбоку
  const wide=gutter>=MENU_W;
  document.body.classList.toggle("wide",wide);
  if(wide){
    root.style.setProperty("--gapend",Math.round(gutter-MENU_W)+"px");
    root.style.setProperty("--bw",Math.round(W-gutter)+"px");
    root.style.setProperty("--cl",Math.round(st.side==="left"?0:gutter)+"px");
    root.style.setProperty("--gutter",Math.round(gutter)+"px");
  }
  applyShift();
}
/* Панель и лист разъезжаются навстречу и в сумме дают ширину панели:
     панель проходит  gutter        (из-под листа до края окна),
     лист уступает    266 - gutter  (ровно нехватку места).
   На широком окне панель стоит своей колонкой: лист не двигается,
   а спрятанное положение панели — задвинутое под край контента. */
function applyShift(){
  const root=document.documentElement, body=document.body, W=root.clientWidth;
  const wide=body.classList.contains("wide");
  const gutter=(W-Math.min(CONTENT_MAX,W))/2;
  const dir=st.side==="left"?1:-1;
  // panel-hidden ставится только на время переезда на другую сторону
  const open=!body.classList.contains("panel-hidden")&&(wide||body.classList.contains("nav-open"));
  root.style.setProperty("--panel-shift",(open?0:dir*Math.round(wide?MENU_W:gutter))+"px");
  root.style.setProperty("--shift",(open&&!wide?dir*Math.round(MENU_W-gutter):0)+"px");
}
function setNav(open){document.body.classList.toggle("nav-open",open);applyShift();}
// ResizeObserver надёжнее события resize и ловит плавное перетаскивание окна;
// высоту баннера тоже меряем только здесь — на скролле ничего не двигаем
const _ro=new ResizeObserver(layoutVars);
_ro.observe(document.documentElement);
_ro.observe(document.querySelector(".ribbon"));

/* ==== ЭКСПОРТ В PNG ================================================== */

/* Картинка рисуется на canvas, а не снимается со страницы: так не нужны
   внешние библиотеки, а в файл попадает ровно то, что нужно — заголовок,
   период, сетка и легенда с пояснением про фон. */

const TITLE_H = 62, TITLE_H_FILTERED = 84;   // блок заголовка с подписью про фильтры и без
const PNG = {
  pad: 28, gap: 6, radius: 10,
  head: 90,                    // колонка с номером пары
  col: 168, colNarrow: 62,     // ширина колонки дня
  line: 20, cellPad: 8,
  scale: 2,                    // ретина
  sans: '600 13px "Manrope", "Segoe UI", system-ui, sans-serif',
};

/* Цвета берём из палитры страницы: экспорт совпадает с тем, что видно. */
function pngPalette(){
  const cs = getComputedStyle(document.documentElement);
  const v = n => cs.getPropertyValue(n).trim();
  const mix = (color, pct) => {
    const probe = document.createElement("div");
    probe.style.cssText = "position:absolute;visibility:hidden;background:" +
      `color-mix(in srgb, ${color} ${pct}, ${v("--panel")})`;
    document.body.appendChild(probe);
    const out = getComputedStyle(probe).backgroundColor;
    probe.remove();
    return out;
  };
  const strength = v("--sg-strength") || "38%";
  return {
    ink: v("--ink"), muted: v("--muted"), line: v("--line"),
    panel: v("--panel"), bg: v("--app-bg"), onAccent: v("--on-accent"),
    sg: {
      "1": mix(v("--sg1"), strength),
      "2": mix(v("--sg2"), strength),
      "0": mix(v("--sg0"), v("--sg0-strength") || strength),
    },
    sgPure: { "1": v("--sg1"), "2": v("--sg2"), "0": v("--sg0") },
    type: t => {
      const map = { "Лекция": "--blue", "Практика": "--mint", "Семинар": "--lav",
                    "Лабораторная": "--gold", "Зачёт": "--pink", "Экзамен": "--pink" };
      return v(map[t] || "--neutral-chip");
    },
  };
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

/* Обрезает текст по ширине, добавляя многоточие. */
function fitText(ctx, text, maxWidth){
  if (ctx.measureText(text).width <= maxWidth) return text;
  let cut = text;
  while (cut.length > 1 && ctx.measureText(cut + "…").width > maxWidth) cut = cut.slice(0, -1);
  return cut + "…";
}

/* Кружок с номером подгруппы — тот же знак, что и на сайте. */
function drawSubDot(ctx, x, y, sub, pal){
  const r = 6.5;
  ctx.fillStyle = pal.sgPure[sub] || pal.sgPure["0"];
  ctx.beginPath();
  ctx.arc(x + r, y + 8.5, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = '800 9px "Manrope", "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = pal.onAccent;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(sub, x + r, y + 9);
  ctx.textAlign = "left";
  return r * 2;
}

function drawChip(ctx, x, y, text, bg, fg, pal){
  ctx.font = '800 11px "Manrope", "Segoe UI", system-ui, sans-serif';
  const w = Math.max(34, ctx.measureText(text).width + 14);
  ctx.fillStyle = bg;
  roundRect(ctx, x, y, w, 17, 8.5);
  ctx.fill();
  ctx.fillStyle = fg || pal.onAccent;
  ctx.textBaseline = "middle";
  ctx.fillText(text, x + 7, y + 9);
  return w;
}

/* Строки одной клетки: время, сокращение предмета, аудитория. */
function cellLines(pair){
  const real = pair.lessons.filter(l => !isSelf(l) && l.subject).filter(match);
  if (!real.length && pair.lessons.some(isSelf)) return [{ self: true }];
  return real.map(l => ({
    time: (/(\d{1,2}:\d{2})/.exec(lessonTime(l, pair)) || [])[1] || "",
    abbr: abbr(l.subject), room: l.room || "", type: l.tn, sub: l.subgroup,
  }));
}

function drawCellLines(ctx, lines, x, y, width, pal){
  lines.forEach((ln, i) => {
    const top = y + i * PNG.line;
    if (ln.self){
      ctx.font = PNG.sans;
      ctx.fillStyle = pal.muted;
      ctx.textBaseline = "middle";
      ctx.fillText("самост.", x, top + 9);
      return;
    }
    let cx = x;
    if (ln.time){
      ctx.font = '700 10px "Manrope", "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = pal.ink;
      ctx.textBaseline = "middle";
      ctx.fillText(ln.time, cx, top + 9);
      cx += 30;
    }
    if (ln.sub) cx += drawSubDot(ctx, cx, top, ln.sub, pal) + 4;
    cx += drawChip(ctx, cx, top, ln.abbr, pal.type(ln.type), null, pal) + 5;
    if (ln.room){
      ctx.font = '700 10px "Manrope", "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = pal.muted;
      ctx.fillText(fitText(ctx, ln.room, x + width - cx), cx, top + 9);
    }
  });
}

/* Заливка клетки по подгруппам — тот же смысл, что на сайте. */
function cellFill(ctx, pair, x, y, w, h, pal){
  const real = pair.lessons.filter(l => !isSelf(l) && l.subject).filter(match);
  if (!real.length) return pal.panel;
  const subs = [...new Set(real.map(l => l.subgroup).filter(Boolean))];
  if (!subs.length) return pal.sg["0"];
  if (subs.length === 1) return pal.sg[subs[0]];
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  const first = real.find(l => l.subgroup).subgroup;
  grad.addColorStop(0, pal.sg[first]);
  grad.addColorStop(0.24, pal.sg[first]);
  grad.addColorStop(0.76, pal.sg[first === "1" ? "2" : "1"]);
  grad.addColorStop(1, pal.sg[first === "1" ? "2" : "1"]);
  return grad;
}

function drawTitle(ctx, x, y, width, title, subtitle, pal){
  ctx.textBaseline = "alphabetic";
  ctx.font = '600 26px Georgia, "Times New Roman", serif';
  ctx.fillStyle = pal.ink;
  ctx.fillText(title, x, y + 24);
  ctx.font = PNG.sans;
  ctx.fillStyle = pal.muted;
  ctx.fillText(subtitle, x, y + 46);
  const filters = filterSummary();
  if (filters){
    ctx.font = '700 13px "Manrope", "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = pal.ink;
    ctx.fillText("Показаны не все пары: " + filters, x, y + 68);
  }
  return filters ? TITLE_H_FILTERED : TITLE_H;
}

/* Легенда: тип пары — цвет плашки, подгруппа — цвет фона. */
function drawLegend(ctx, x, y, pal, types){
  ctx.textBaseline = "middle";
  let cx = x, cy = y;
  ctx.font = PNG.sans;
  types.forEach(t => {
    ctx.fillStyle = pal.type(t);
    ctx.beginPath(); ctx.arc(cx + 6, cy + 8, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = pal.muted;
    ctx.fillText(t, cx + 18, cy + 8);
    cx += 18 + ctx.measureText(t).width + 18;
  });

  cy += 26; cx = x;
  ctx.font = '700 11px "Manrope", "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = pal.muted;
  ctx.fillText("ФОН КАРТОЧКИ", cx, cy + 8);
  cx += ctx.measureText("ФОН КАРТОЧКИ").width + 16;

  const swatch = (fill, label) => {
    ctx.fillStyle = fill;
    roundRect(ctx, cx, cy + 2, 18, 12, 4); ctx.fill();
    ctx.strokeStyle = pal.line; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = PNG.sans; ctx.fillStyle = pal.muted;
    ctx.fillText(label, cx + 24, cy + 8);
    cx += 24 + ctx.measureText(label).width + 18;
  };
  swatch(pal.sg["1"], "1-я подгруппа");
  swatch(pal.sg["2"], "2-я подгруппа");
  const both = ctx.createLinearGradient(cx, 0, cx + 18, 0);
  both.addColorStop(0, pal.sg["1"]); both.addColorStop(0.5, pal.sg["1"]);
  both.addColorStop(0.5, pal.sg["2"]); both.addColorStop(1, pal.sg["2"]);
  swatch(both, "обе подгруппы");
  swatch(pal.sg["0"], "пара у всех");
  return 52;
}

function newCanvas(width, height){
  const c = document.createElement("canvas");
  c.width = width * PNG.scale;
  c.height = height * PNG.scale;
  const ctx = c.getContext("2d");
  ctx.scale(PNG.scale, PNG.scale);
  return { canvas: c, ctx };
}

/* ---- неделя ---- */
function drawWeekPNG(){
  const pal = pngPalette();
  const w = DATA.weeks[st.cur];
  const cols = weekColumns(), quiet = quietDays();
  const width = PNG.pad * 2 + PNG.head +
    cols.reduce((s, di) => s + (quiet.has(di) ? PNG.colNarrow : PNG.col) + PNG.gap, 0);

  const rows = [];
  for (let pi = 0; pi < 7; pi++){
    const lines = cols.map(di => cellLines(w.days[di].pairs[pi]));
    const max = Math.max(1, ...lines.map(l => l.length));
    rows.push({ pi, lines, height: Math.max(46, max * PNG.line + PNG.cellPad * 2) });
  }

  const titleH = filtersOn() ? TITLE_H_FILTERED : TITLE_H;
  const gridTop = PNG.pad + titleH + 30;
  const gridHeight = rows.reduce((s, r) => s + r.height + PNG.gap, 0);
  const height = gridTop + gridHeight + 16 + 52 + PNG.pad;

  const { canvas, ctx } = newCanvas(width, height);
  ctx.fillStyle = pal.bg;
  ctx.fillRect(0, 0, width, height);

  drawTitle(ctx, PNG.pad, PNG.pad, width,
    (DATA.title || "").split("(")[0].trim() || "Расписание",
    "Неделя " + (st.cur + 1) + " · " + weekRange(st.cur) + " · " + (w.odd ? "нечётная" : "чётная"), pal);

  // шапка с днями
  let x = PNG.pad + PNG.head;
  ctx.textAlign = "center";
  cols.forEach(di => {
    const cw = quiet.has(di) ? PNG.colNarrow : PNG.col;
    ctx.font = PNG.sans; ctx.fillStyle = pal.muted; ctx.textBaseline = "middle";
    ctx.fillText(SHORT[di], x + cw / 2, gridTop - 20);
    ctx.font = '600 11px "Manrope", "Segoe UI", system-ui, sans-serif';
    ctx.fillText((w.days[di].date || "").slice(0, 5), x + cw / 2, gridTop - 6);
    x += cw + PNG.gap;
  });
  ctx.textAlign = "left";

  let y = gridTop;
  rows.forEach(row => {
    const label = (w.days[cols[0]].pairs[row.pi].pair || "").split(PAIR_NL);
    ctx.textAlign = "center";
    ctx.font = '700 13px "Manrope", "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = pal.ink; ctx.textBaseline = "middle";
    ctx.fillText((label[0] || "").replace(" пара", ""), PNG.pad + PNG.head / 2, y + 16);
    ctx.font = '600 11px "Manrope", "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = pal.muted;
    ctx.fillText(label[1] || "", PNG.pad + PNG.head / 2, y + 32);
    ctx.textAlign = "left";

    let cx = PNG.pad + PNG.head;
    cols.forEach((di, ci) => {
      const cw = quiet.has(di) ? PNG.colNarrow : PNG.col;
      const pair = w.days[di].pairs[row.pi];
      ctx.fillStyle = cellFill(ctx, pair, cx, y, cw, row.height, pal);
      roundRect(ctx, cx, y, cw, row.height, PNG.radius); ctx.fill();
      ctx.strokeStyle = pal.line; ctx.lineWidth = 1; ctx.stroke();
      drawCellLines(ctx, row.lines[ci], cx + PNG.cellPad, y + PNG.cellPad, cw - PNG.cellPad * 2, pal);
      cx += cw + PNG.gap;
    });
    y += row.height + PNG.gap;
  });

  const types = collectDictionaries().types;
  drawLegend(ctx, PNG.pad, y + 12, pal, types);
  return canvas;
}

/* ---- месяц ---- */
function drawMonthPNG(){
  const pal = pngPalette();
  const mo = MONTHS[st.monthPtr];
  const quiet = quietDays();
  const widths = [0,1,2,3,4,5,6].map(i => quiet.has(i) ? PNG.colNarrow : PNG.col);
  const width = PNG.pad * 2 + widths.reduce((s, w) => s + w + PNG.gap, 0);

  const first = new Date(mo.y, mo.m, 1);
  const off = (first.getDay() + 6) % 7;
  const dim = new Date(mo.y, mo.m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < off; i++) cells.push(null);
  for (let d = 1; d <= dim; d++){
    const dt = new Date(mo.y, mo.m, d);
    const ref = DATE_MAP[keyOf(dt)];
    const day = ref ? DATA.weeks[ref.wi].days[ref.di] : null;
    // день самостоятельной работы — одна строка на клетку, а не по строке на пару
    let lines = day ? day.pairs.flatMap(p => cellLines(p)).filter(Boolean) : [];
    if (lines.some(l => l.self)) lines = [{ self: true }];
    cells.push({ d, day, lines });
  }
  while (cells.length % 7) cells.push(null);

  const rowsCount = cells.length / 7;
  const rowHeights = [];
  for (let r = 0; r < rowsCount; r++){
    const slice = cells.slice(r * 7, r * 7 + 7);
    const max = Math.max(1, ...slice.map(c => (c ? c.lines.length : 0)));
    rowHeights.push(Math.max(58, 20 + max * PNG.line + PNG.cellPad));
  }

  const titleH = filtersOn() ? TITLE_H_FILTERED : TITLE_H;
  const gridTop = PNG.pad + titleH + 24;
  const height = gridTop + rowHeights.reduce((s, h) => s + h + PNG.gap, 0) + 16 + 52 + PNG.pad;
  const { canvas, ctx } = newCanvas(width, height);
  ctx.fillStyle = pal.bg; ctx.fillRect(0, 0, width, height);

  drawTitle(ctx, PNG.pad, PNG.pad, width,
    (DATA.title || "").split("(")[0].trim() || "Расписание",
    RU_MONTHS[mo.m] + " " + mo.y, pal);

  let x = PNG.pad;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = '700 12px "Manrope", "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = pal.muted;
  SHORT.forEach((s, i) => { ctx.fillText(s, x + widths[i] / 2, gridTop - 10); x += widths[i] + PNG.gap; });
  ctx.textAlign = "left";

  let y = gridTop;
  for (let r = 0; r < rowsCount; r++){
    let cx = PNG.pad;
    for (let c = 0; c < 7; c++){
      const cell = cells[r * 7 + c], cw = widths[c], ch = rowHeights[r];
      if (cell){
        const pairs = cell.day ? cell.day.pairs : [];
        const all = { lessons: pairs.flatMap(p => p.lessons) };
        ctx.fillStyle = cellFill(ctx, all, cx, y, cw, ch, pal);
        roundRect(ctx, cx, y, cw, ch, PNG.radius); ctx.fill();
        ctx.strokeStyle = pal.line; ctx.lineWidth = 1; ctx.stroke();
        ctx.font = '700 11px "Manrope", "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = pal.muted; ctx.textBaseline = "middle";
        ctx.fillText(String(cell.d), cx + PNG.cellPad, y + 12);
        drawCellLines(ctx, cell.lines, cx + PNG.cellPad, y + 20, cw - PNG.cellPad * 2, pal);
      }
      cx += cw + PNG.gap;
    }
    y += rowHeights[r] + PNG.gap;
  }

  drawLegend(ctx, PNG.pad, y + 12, pal, collectDictionaries().types);
  return canvas;
}

/* Оркестратор: выбирает вид, рисует и отдаёт файл. */
function exportPNG(){
  const month = inMonth();
  const canvas = month ? drawMonthPNG() : drawWeekPNG();
  const w = DATA.weeks[st.cur];
  const name = month
    ? "Расписание " + RU_MONTHS[MONTHS[st.monthPtr].m] + " " + MONTHS[st.monthPtr].y
    : "Расписание неделя " + (st.cur + 1) + " " + weekRange(st.cur).replace(/\s/g, "");
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, "image/png");
}

/* ==== СТАРТ ================================================================= */

/* Данные могут не приехать или оказаться битыми. Сайт от этого не ломается:
   каркас остаётся на месте, а в области расписания показывается заглушка. */
function schedulePlaceholder(text){
  const c=$("content");
  if(c)c.innerHTML='<div class="emptystate"><div class="big">'
    +'<svg class="ic" aria-hidden="true"><use href="#i-cloudsun"/></svg></div>'+text+'</div>';
  const legend=$("legend"); if(legend)legend.innerHTML="";
  const footer=$("footer"); if(footer)footer.innerHTML="";
  document.documentElement.classList.remove("preload");
}
function dataLooksValid(d){
  return !!d && Array.isArray(d.weeks) && d.weeks.length>0
    && d.weeks.every(w=>Array.isArray(w.days) && w.days.length>0
      && w.days.every(day=>Array.isArray(day.pairs)));
}

// Расписание группы живёт в своём репозитории и там же обновляется — берём его
// оттуда, а не держим стареющий снимок. Локальная копия остаётся запасной: без
// сети или при недоступном raw сайт всё равно должен показать расписание.
const UNI_URL="https://raw.githubusercontent.com/rediiskka/raspisanie-3bi1/refs/heads/master/data.json";
async function fetchSchedule(){
  try{
    const r=await fetch(`${UNI_URL}?v=${Date.now()}`,{cache:"reload"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const data=await r.json();
    if(!dataLooksValid(data))throw new Error("расписание не похоже на себя");
    return data;
  }catch(e){
    console.warn("Расписание группы не пришло из репозитория, беру локальную копию:",e);
  }
  const r=await fetch("data.json",{cache:"no-cache"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return r.json();
}

async function boot(){
  try{
    DATA=await fetchSchedule();
  }catch(e){
    console.error("Не удалось загрузить расписание:",e);
    schedulePlaceholder("Здесь скоро появится расписание.");
    return;
  }
  if(!dataLooksValid(DATA)){
    schedulePlaceholder("Здесь скоро появится расписание.");
    return;
  }
  try{
    load();
    prep();
    const shared=hashRead();
    if(!["week","m1","custom"].includes(st.scope))st.scope="week";
    if(st.view==="month"&&!/[#&]m=/.test(location.hash))st.monthPtr=monthOfWeek(st.cur);
    if(!(st.cur>=0&&st.cur<DATA.weeks.length))st.cur=todayWeek();
    if(!shared&&!localStorage.getItem(KEY))st.cur=todayWeek();
    initControls();
    await show();
  }catch(e){
    console.error("Ошибка при сборке страницы:",e);
    schedulePlaceholder("Здесь скоро появится расписание.");
    return;
  }
  layoutVars();
  weather();
  // перерисовываем только когда сменилась текущая или ближайшая пара
  setInterval(()=>{if(markKey(nowMarks())!==_mark)render();},30000);
  // анимации включаем, когда всё встало на места; таймер — страховка,
  // если вкладка в фоне и кадры не выдаются
  const dropPreload=()=>document.documentElement.classList.remove("preload");
  requestAnimationFrame(()=>requestAnimationFrame(dropPreload));
  setTimeout(dropPreload,120);
}
// boot() запускается сразу, только если ключ уже лежит в этой вкладке —
// иначе его вызывает обработчик формы после верного пароля.
restoreKey().then(ok => { if (ok) { hideGate(); boot(); } });
